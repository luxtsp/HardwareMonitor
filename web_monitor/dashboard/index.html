<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWmonitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <h1>// HWmonitor</h1>
  <div id="status">
    <div id="pulse"></div>
    <span id="status-text">CONNECTING</span>
  </div>
</header>

<div class="section">
  <div class="section-label">── Usage</div>
  <div class="grid" id="usage-grid">
    <div class="card" id="card-cpu-usage">
      <div class="card-label">CPU</div>
      <div class="card-value null" id="val-cpu-usage">—</div>
      <div class="card-unit">percent</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-cpu-usage"></div></div>
    </div>
    <div class="card" id="card-ram-usage">
      <div class="card-label">RAM</div>
      <div class="card-value null" id="val-ram-usage">—</div>
      <div class="card-unit">percent</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-ram-usage"></div></div>
    </div>
    <div class="card" id="card-storage-usage">
      <div class="card-label">Storage</div>
      <div class="card-value null" id="val-storage-usage">—</div>
      <div class="card-unit">percent</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-storage-usage"></div></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-label">── Temperature</div>
  <div class="grid" id="temp-grid">
    <div class="card" id="card-cpu-temp">
      <div class="card-label">CPU</div>
      <div class="card-value null" id="val-cpu-temp">—</div>
      <div class="card-unit">°C</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-cpu-temp"></div></div>
    </div>
    <div class="card" id="card-gpu-temp">
      <div class="card-label">GPU</div>
      <div class="card-value null" id="val-gpu-temp">—</div>
      <div class="card-unit">°C</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-gpu-temp"></div></div>
    </div>
    <div class="card" id="card-motherboard-temp">
      <div class="card-label">Motherboard</div>
      <div class="card-value null" id="val-motherboard-temp">—</div>
      <div class="card-unit">°C</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-motherboard-temp"></div></div>
    </div>
    <div class="card" id="card-nvme-temp">
      <div class="card-label">NVMe</div>
      <div class="card-value null" id="val-nvme-temp">—</div>
      <div class="card-unit">°C</div>
      <div class="bar-wrap"><div class="bar-fill" id="bar-nvme-temp"></div></div>
    </div>
  </div>
</div>

<div id="last-updated">never updated</div>

<!-- Countdown ring -->
<div id="countdown-wrap">
  <span id="countdown-label">NEXT IN 5s</span>
  <svg id="ring" viewBox="0 0 30 30">
    <circle id="ring-track" cx="15" cy="15" r="12"/>
    <circle id="ring-fill"  cx="15" cy="15" r="12"/>
  </svg>
</div>
<script src="/static/main.js"></script>
</body>
</html>
